class DirectoryError extends Error {}
class ProtectedFileError extends DirectoryError {}

const digest = data => createHash('sha256').update(data).digest('hex');
const pathKey = value => process.platform === 'win32' ? value.toLowerCase() : value;
const relativePath = (root, file) => path.relative(root, file).split(path.sep).join('/');

function once(text, before, after) {
  const start = text.indexOf(before);
  if (start < 0 || text.indexOf(before, start + before.length) >= 0) throw new Error('手册运行时校验失败。');
  return text.slice(0, start) + after + text.slice(start + before.length);
}

function scriptText(text, name) {
  const marker = `id="${name}"`;
  const tag = text.indexOf(marker);
  const start = text.indexOf('>', tag) + 1;
  const end = text.indexOf('</script', start);
  if (tag < 0 || start === 0 || end < 0) throw new Error('压缩手册缺少必要数据。');
  return text.slice(start, end);
}

function unpackBook(outer) {
  if (Buffer.byteLength(outer) > MAX_BASE64 + 1024 * 1024) throw new Error('压缩手册超出支持的大小。');
  const loader = '\n/* --' + '>\n';
  const offset = outer.indexOf(loader);
  if (offset < 0) throw new Error('单文件手册启动标记无效。');
  const markup = outer.slice(offset + loader.length);
  const meta = JSON.parse(scriptText(markup, 'fh-pack-meta'));
  const encoded = scriptText(markup, 'fh-pack-data');
  if (meta.format !== 'fh-gzip-html-1' || !Number.isSafeInteger(meta.bytes) || meta.bytes < 1 ||
      meta.bytes > MAX_INNER_BYTES || !/^[0-9a-f]{64}$/.test(meta.sha256) || encoded.length > MAX_BASE64) {
    throw new Error('压缩手册的格式、长度或摘要无效。');
  }
  const raw = gunzipSync(Buffer.from(encoded, 'base64'), {maxOutputLength:meta.bytes});
  if (raw.length !== meta.bytes || digest(raw) !== meta.sha256) throw new Error('压缩手册的内容校验失败。');
  return {inner:decoder.decode(raw), meta};
}

function localPage(file, outer = fs.readFileSync(file, 'utf8')) {
  const unpacked = unpackBook(outer);
  const meta = unpacked.meta;
  let inner = unpacked.inner;
  const overlay = JSON.parse(Buffer.from(overlayBase64, 'base64').toString('utf8'));
  const runtime = scriptText(inner, 'fh-ai-runtime');
  const updaterStart = runtime.indexOf('function installDirectoryUpdate() {');
  const updaterEnd = runtime.indexOf(overlay.hook, updaterStart);
  if (updaterStart < 0 || updaterEnd <= updaterStart || !overlay.updater?.endsWith(overlay.hook)) {
    throw new Error('手册更新模块校验失败。');
  }
  const updater = runtime.slice(updaterStart, updaterEnd + overlay.hook.length);
  const replacements = [[updater, overlay.updater], ...overlay.replacements];
  let patched = runtime;
  for (const [before, after] of replacements) patched = once(patched, before, after);
  patched = once(patched, overlay.hook, overlay.hook + overlay.addon);
  const config = JSON.stringify({packHash:meta.sha256, replacements, folderPathInput:true, unifiedHandbook:true, selfUpdate:true, currentFile:file})
    .replaceAll('<', '\\u003c');
  const boot = `<script id="fh-local-config" type="application/json">${config}</script>\n` +
    '<script id="fh-local-boot">window.fhOpenedPackHash=JSON.parse(document.getElementById("fh-local-config").textContent).packHash;</script>\n';
  const marker = '<script ' + 'id="fh-ai-runtime"';
  inner = once(once(inner, runtime, patched), marker, boot + marker);
  const headEnd = inner.indexOf('</head>');
  if (headEnd < 0) throw new Error('手册页面结构无效。');
  return Buffer.from(inner.slice(0, headEnd) + `<style id="fh-local-style">${overlay.css}</style>\n` + inner.slice(headEnd));
}

function validateCompleteBook(inner, meta) {
  const read = name => JSON.parse(scriptText(inner, name));
  const manifest = read('fh-ai-manifest');
  const corpusText = scriptText(inner, 'fh-ai-corpus');
  const corpus = JSON.parse(corpusText);
  const index = read('fh-ai-index');
  const sources = read('source-data');
  const search = read('search-data');
  const pages = read('fh-book-pages');
  const corpusHash = digest(Buffer.from(corpusText));
  if (!Array.isArray(corpus) || !Array.isArray(search) || !Number.isSafeInteger(index.count) || index.count < 1 ||
      index.count !== corpus.length || index.completed !== index.count || manifest.chunks !== index.count ||
      manifest.pendingVectors !== 0 || manifest.documents !== search.length ||

  for (const doc of search) {
    const source = sources[doc.id];
    if (!source || !pages[doc.id] || source.path !== doc.path || digest(Buffer.from(source.base64, 'base64')) !== source.sha256) {
      throw new DirectoryError('文档完整性校验失败，原手册未更新。');
    }
  }
  if (corpus.some(chunk => !sources[chunk.docId])) throw new DirectoryError('检索片段与文档不一致，原手册未更新。');
  return {packHash:meta.sha256, documents:manifest.documents, chunks:index.count};
}

function saveCurrentBook(file, body) {
  if (typeof body.html !== 'string' || !/^[0-9a-f]{64}$/.test(body.expectedPackHash || '') ||
      Object.keys(body).some(key => !['html', 'expectedPackHash'].includes(key))) {
    throw new DirectoryError('手册更新请求无效。');
  }
  const original = fs.readFileSync(file);
  const outer = decoder.decode(original);
  const current = unpackBook(outer);
  if (current.meta.sha256 !== body.expectedPackHash) {
    throw new DirectoryError('当前手册已被其他页面或程序更新，请刷新后重新扫描。');
  }
  // The browser may update the embedded book, but cannot change the Node entry or loader.
  const skeleton = value => once(once(value, scriptText(value, 'fh-pack-data'), '__FH_DATA__'),
    scriptText(value, 'fh-pack-meta'), '__FH_META__');
  if (skeleton(body.html) !== skeleton(outer)) throw new DirectoryError('手册封装已变化，原文件未更新。请重新打开当前手册。');
  const next = unpackBook(body.html);
  const info = validateCompleteBook(next.inner, next.meta);
  const page = localPage(file, body.html);
  const staged = path.join(path.dirname(file), '.fh-handbook-' + randomUUID() + '.tmp');
  let descriptor;
  try {
    descriptor = fs.openSync(staged, 'wx', fs.statSync(file).mode);
    fs.writeFileSync(descriptor, body.html, 'utf8');
    fs.fsyncSync(descriptor);
    fs.closeSync(descriptor);
    descriptor = undefined;
    if (digest(fs.readFileSync(staged)) !== digest(Buffer.from(body.html))) throw new DirectoryError('临时文件校验失败，原手册未更新。');
    if (digest(fs.readFileSync(file)) !== digest(original)) throw new DirectoryError('保存期间手册发生变化，请刷新后重新扫描。');
    fs.renameSync(staged, file);
  } catch (error) {
    if (error instanceof DirectoryError) throw error;
    throw new DirectoryError('无法写回当前 HTML，原手册未更新。请检查文件是否只读、被占用或目录不可写。');
  } finally {
    if (descriptor !== undefined) fs.closeSync(descriptor);
    if (fs.existsSync(staged)) fs.unlinkSync(staged);
  }
  return {page, result:{saved:true, path:file, ...info}};
}

function terms(text) {
  const result = new Set();
  for (const word of text.normalize('NFKC').toLowerCase().match(/[a-z0-9]+(?:[_.:-][a-z0-9]+)*|[\u3400-\u9fff]+/g) || []) {
    if (/^[a-z0-9]/.test(word)) {
      result.add(word);
      for (const part of word.match(/[a-z0-9]{2,}/g) || []) result.add(part);
    } else {
      for (let i = 0; i + 1 < word.length; i++) result.add(word.slice(i, i + 2));
    }
  }
  return result;
}

function chunks(source, relative) {
  const lines = source.split(/\r\n?|\n/);
  const sections = [];
  let fence = '';
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const marker = /^ {0,3}(`{3,}|~{3,})(.*)$/.exec(line);
    if (fence) {
      if (marker && marker[1][0] === fence[0] && marker[1].length >= fence.length && !marker[2].trim()) fence = '';
      continue;
    }
    if (marker) {
      fence = marker[1];
      continue;
    }
    const heading = /^ {0,3}#{1,6}(?:[ \t]+|$)(.*)$/.exec(line);
    if (heading) sections.push([i, heading[1].replace(/\s+#+\s*$/, '').trim() || '正文']);
    else if (i && /^ {0,3}(?:=+|-+)[ \t]*$/.test(line) && /^ {0,3}[^#>\s`~*-]/.test(lines[i - 1])) {
      sections.push([i - 1, lines[i - 1].trim()]);
    }
  }
  if (sections[0]?.[0] !== 0) sections.unshift([0, '正文']);
  const result = [];
  for (let i = 0; i < sections.length; i++) {
    const [start, section] = sections[i];
    const body = lines.slice(start, sections[i + 1]?.[0]).join('\n');
    const headings = terms(`${relative} ${section}`);
    for (let offset = 0, line = start + 1; offset < body.length;) {
      let end = Math.min(offset + 1150, body.length);
      const newline = body.lastIndexOf('\n', end - 1);
      if (end < body.length && newline >= offset + 650) end = newline + 1;
      // Keep both code units of an astral character in the same excerpt.
      if (end < body.length && /[\uDC00-\uDFFF]/.test(body[end])) end++;
      const text = body.slice(offset, end);
      if (text.trim()) result.push({section:section.slice(0, 180), line, text, headings, words:terms(text)});
      line += text.split('\n').length - 1;
      offset = end;
    }
  }
  return result;
}

const sameFile = (a, b) => a.dev === b.dev && a.ino === b.ino && a.size === b.size && a.mtimeNs === b.mtimeNs;
const statOptions = {bigint:true};

function isProtected(bytes) {
  const header = bytes.subarray(0, 100).toString('latin1');
  return header.includes('E-SafeNet') && header.includes('LOCK');
}

function readBytes(file, info, limit) {
  if (!info.isFile() || pathKey(fs.realpathSync.native(file)) !== pathKey(file)) {
    throw new DirectoryError('已跳过文件链接或特殊文件。');
  }
  if (info.size > limit) throw new DirectoryError('文件超过 ' + (limit / (1024 * 1024)) + ' MiB 的单文件读取上限。');
  const fd = fs.openSync(file, fs.constants.O_RDONLY | (fs.constants.O_NOFOLLOW || 0) | (fs.constants.O_NONBLOCK || 0));
  let bytes;
  try {
    if (!sameFile(info, fs.fstatSync(fd, statOptions))) throw new DirectoryError('文件在扫描时被替换，请重新扫描。');
    const data = Buffer.alloc(Number(info.size) + 1);
    let count = 0;
    while (count < data.length) {
      const size = fs.readSync(fd, data, count, data.length - count, null);
      if (!size) break;
      count += size;
    }
    if (count !== Number(info.size) || !sameFile(info, fs.fstatSync(fd, statOptions)) ||
        !sameFile(info, fs.lstatSync(file, statOptions)) || pathKey(fs.realpathSync.native(file)) !== pathKey(file)) {
      throw new DirectoryError('文件在扫描时发生变化，请重新扫描。');
    }
    bytes = data.subarray(0, count);
  } finally {
    fs.closeSync(fd);
  }
  if (isProtected(bytes)) throw new ProtectedFileError('文件受保护，当前进程无法读取。');
  return bytes;
}

function readWindowsMarkdown(file, info) {
  const unchanged = () => sameFile(info, fs.lstatSync(file, statOptions)) &&
    pathKey(fs.realpathSync.native(file)) === pathKey(file);
  if (!unchanged() || /["\r\n]/.test(file)) throw new DirectoryError('文件路径已变化，请重新扫描。');
  const cmd = path.join(process.env.SystemRoot || 'C:\\Windows', 'System32', 'cmd.exe');
  // Pass the already-scoped path as data, never concatenate it into the command.
  const result = spawnSync(cmd, ['/q', '/d', '/v:off', '/c', 'type', '"%FH_MARKDOWN_FILE%"'], {
    windowsHide:true, windowsVerbatimArguments:true, timeout:5000, maxBuffer:MAX_FILE_BYTES + 1,
    env:{...process.env, FH_MARKDOWN_FILE:file}
  });
  if (!unchanged()) throw new DirectoryError('文件在扫描时发生变化，请重新扫描。');
  const bytes = result.stdout;
  if (result.error || result.status !== 0 || !bytes?.length || isProtected(bytes)) {
    throw new DirectoryError('文件受保护，Windows 文本读取未返回可用正文。');
  }
  if (bytes.length > MAX_FILE_BYTES) throw new DirectoryError('文件超过 4 MiB 的单文件读取上限。');
  return bytes;
}

function readMarkdown(file, info) {
  let bytes;
  try {bytes = readBytes(file, info, MAX_FILE_BYTES);}
  catch (error) {
    if (!(error instanceof ProtectedFileError) || process.platform !== 'win32') throw error;
    bytes = readWindowsMarkdown(file, info);
  }
  let text;
  try {text = decoder.decode(bytes);}
  catch {throw new DirectoryError('无法按 UTF-8 读取 Markdown。');}
  if (/[\0\uFFFD]/.test(text)) throw new DirectoryError('文件包含无法确认的字符。');
  return {text, checksum:digest(bytes), bytes};
}

class DirectoryIndex {
  constructor(root = '') {
    this.root = root;
    this.rootId = root ? digest(pathKey(root)) : '';
    this.documents = new Map();
    this.files = [];
    this.assets = new Map();
    this.unavailable = [];
    this.warnings = [];
    this.scannedAt = null;
    this.scope = '';
    this.revision = '';
  }

  snapshot() {
    return {root:this.root, rootId:this.rootId, scope:this.scope, scannedAt:this.scannedAt,
      files:this.files, assets:[...this.assets.keys()], unavailable:this.unavailable,
      indexed:this.documents.size, warnings:this.warnings, revision:this.revision};
  }

  scan() {
    if (!this.root) return this.snapshot();
    const files = [], documents = new Map(), assets = new Map(), unavailable = [], warnings = [];
    const pending = [this.root];
    while (pending.length) {
      const directory = pending.pop();
      const display = relativePath(this.root, directory) || '.';
      let entries;
      try {
        if (fs.lstatSync(directory).isSymbolicLink() || pathKey(fs.realpathSync.native(directory)) !== pathKey(directory)) {
          warnings.push(`${display} · 已跳过目录链接`);
          unavailable.push(display);
          continue;
        }
        entries = fs.readdirSync(directory, {withFileTypes:true});
      } catch {
        warnings.push(`${display} · 目录无法访问`);
        unavailable.push(display);
        continue;
      }
      for (const entry of entries) {
        const file = path.join(directory, entry.name);
        if (entry.isDirectory()) {
          if (!SKIP_DIRS.has(entry.name.toLowerCase())) pending.push(file);
          continue;
        }
        const relative = relativePath(this.root, file);
        if (!/\.md$/i.test(entry.name)) {
          if (entry.isSymbolicLink()) {
            warnings.push(`${relative} · 已跳过链接`);
            unavailable.push(relative);
          } else if (entry.isFile() && IMAGE.test(entry.name)) {
            try {assets.set(relative, fs.lstatSync(file, statOptions));}
            catch {warnings.push(`${relative} · 图片无法访问`);}
          }
          continue;
        }
        const row = {path:relative, modified:null, error:null};
        try {
          const info = fs.lstatSync(file, statOptions);
          row.modified = new Date(Number(info.mtimeMs)).toISOString();
          const doc = readMarkdown(file, info);
          row.sha256 = doc.checksum;
          const cached = this.documents.get(relative);
          documents.set(relative, cached?.checksum === doc.checksum ? cached :
            {...doc, chunks:chunks(doc.text, relative)});
        } catch (error) {
          row.error = error instanceof DirectoryError ? error.message : '无法读取文件，请检查权限或文件是否已移动。';
        }
        files.push(row);
      }
    }
    files.sort((a, b) => a.path.localeCompare(b.path, 'zh-CN'));
    const version = [...documents.keys()].sort().map(key => `${key}\0${documents.get(key).checksum}`).join('\0');
    this.scope = `fh-local:${this.rootId}:${digest(version)}`;
    const assetVersion = [...assets.keys()].sort().map(file => {
      const info = assets.get(file);
      return [file, info.dev, info.ino, info.size, info.mtimeNs].map(String).join('\0');
    });
    this.revision = digest(JSON.stringify([this.scope, assetVersion, unavailable.sort(),
      files.filter(row => row.error).map(row => [row.path, row.error])]));
    this.documents = documents;
    this.files = files;
    this.assets = assets;
    this.unavailable = unavailable;
    this.warnings = warnings.sort();
    this.scannedAt = new Date().toISOString();
    return this.snapshot();
  }

  search(query) {
    const wanted = terms(query.trim().replace(/^请(?:问|说明|解释|分析|对比|介绍)?|怎么|如何|怎样|什么|哪些|能否|是否/g, ' '));
    if (!wanted.size) return [];
    const matches = [], frequency = new Map();
    let total = 0;
    for (const [file, doc] of this.documents) {
      total += doc.chunks.length;
      for (const chunk of doc.chunks) {
        const found = [...wanted].filter(word => chunk.headings.has(word) || chunk.words.has(word));
        if (!found.length) continue;
        for (const word of found) frequency.set(word, (frequency.get(word) || 0) + 1);
        matches.push({file, doc, chunk, found});
      }
    }
    const weights = new Map([...frequency].map(([word, count]) => [word, Math.log1p(total / count)]));
    for (const match of matches) {
      match.score = match.found.reduce((sum, word) => sum + weights.get(word) * (match.chunk.headings.has(word) ? 1.8 : 1), 0);
    }
    matches.sort((a, b) => b.score - a.score);
    const result = [], perFile = new Map();
    for (const {file, doc, chunk} of matches) {
      const count = perFile.get(file) || 0;
      if (count >= 3) continue;
      const anchor = `fh-local:${this.rootId}:${doc.checksum}:${chunk.line}`;
      const title = `${chunk.section} · 第 ${chunk.line} 行`;
      result.push({id:`${anchor}:${file}`, anchor, docId:this.scope, title, docTitle:file, path:file,
        context:`${file} / ${title}`, text:chunk.text, part:1, parts:1,
        qualified:/待确认|待核实|推断|推测|建议|未验证|未执行/.test(chunk.text)});
      perFile.set(file, count + 1);
      if (result.length === 24) break;
    }
    return result;
  }
}

async function pickDirectory(initial) {
  if (process.platform === 'win32') {
    const script = `
$ErrorActionPreference = 'Stop'
[Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
Add-Type -AssemblyName System.Windows.Forms
$owner = New-Object Windows.Forms.Form
$owner.TopMost = $true
$picker = New-Object Windows.Forms.FolderBrowserDialog
$picker.Description = '选择本地 Markdown 目录'
$picker.SelectedPath = $env:FH_PICK_ROOT
$picker.ShowNewFolderButton = $false
try { if ($picker.ShowDialog($owner) -eq 'OK') { [Console]::Write($picker.SelectedPath) } }
finally { $picker.Dispose(); $owner.Dispose() }
`;
    const powershell = path.join(process.env.SystemRoot || 'C:\\Windows', 'System32', 'WindowsPowerShell', 'v1.0', 'powershell.exe');
    const result = await run(powershell, ['-NoProfile','-NonInteractive','-STA','-EncodedCommand',Buffer.from(script,'utf16le').toString('base64')],
      {windowsHide:true, env:{...process.env,FH_PICK_ROOT:initial}});
    return result.stdout.replace(/\r?\n$/, '');
  }
  if (process.platform === 'darwin') {
    const source = 'on run argv\ntry\nreturn POSIX path of (choose folder with prompt "选择本地 Markdown 目录" default location (POSIX file (item 1 of argv)))\n' +
      'on error number -128\nreturn ""\nend try\nend run';
    const result = await run('/usr/bin/osascript', ['-e', source, initial]);
    return result.stdout.replace(/\n$/, '');
  }
  for (const [program, args] of [['zenity',['--file-selection','--directory',`--filename=${initial}/`]],
                                ['kdialog',['--getexistingdirectory',initial]]]) {
    try {return (await run(program, args)).stdout.replace(/\n$/, '');}
    catch (error) {
      if (error.code === 'ENOENT') continue;
      if (error.code === 1 && !error.stderr.trim()) return '';
      throw error;
    }
  }
  throw new DirectoryError('本机没有可用的目录选择器，请展开「输入目录路径」。');
}

function openDirectory(value) {
  if (typeof value !== 'string' || !path.isAbsolute(value) || value.includes('\0') ||
      (process.platform === 'win32' && !/^[a-z]:[\\/]|^\\\\[^?.]/i.test(value))) {
    throw new DirectoryError('请输入本地目录的绝对路径。');
  }
  try {
    const root = fs.realpathSync.native(value);
    if (fs.statSync(root).isDirectory()) return new DirectoryIndex(root);
  } catch {}
  throw new DirectoryError('目录不存在或无法访问。');
}

function storeDirectory(file, root) {
  fs.mkdirSync(path.dirname(file), {recursive:true});
  const staged = `${file}.${randomUUID()}.tmp`;
  try {
    fs.writeFileSync(staged, JSON.stringify({root}), {encoding:'utf8', mode:0o600, flag:'wx'});
    fs.renameSync(staged, file);
  } finally {
    fs.rmSync(staged, {force:true});
  }
}

function directoryService(settings) {
  let index = new DirectoryIndex();
  let picking = false;
  try {index = openDirectory(JSON.parse(fs.readFileSync(settings, 'utf8')).root);}
  catch {}
  return async (action, body) => {
    if (action === 'select') {
      if (picking) throw new DirectoryError('已有目录选择窗口打开。');
      picking = true;
      try {
        let selected;
        try {selected = body.path === undefined ? await pickDirectory(index.root || process.cwd()) : body.path;}
        catch (error) {
          if (error instanceof DirectoryError) throw error;
          throw new DirectoryError('无法打开系统目录选择器，请展开「输入目录路径」。');
        }
        if (selected === '' && body.path === undefined) return {...index.snapshot(), cancelled:true};
        const next = openDirectory(selected);
        const snapshot = next.scan();
        index = next;
        try {storeDirectory(settings, index.root);}
        catch {index.warnings = [...index.warnings, '无法记住目录，下次启动时请重新选择。'];}
        return {...snapshot, warnings:index.warnings};
      } finally {picking = false;}
    }
    if (action === 'scan') return index.scan();
    if (!index.root || body.rootId !== index.rootId) throw new DirectoryError('所选目录已切换，请在知识索引中重新扫描后再试。');
    if (action === 'search') {
      if (typeof body.query !== 'string' || !body.query.trim() || body.query.length > 2000) {
        throw new DirectoryError('问题长度须为 1 至 2,000 字符。');
      }
      return {snapshot:index.scan(), sources:index.search(body.query)};
    }
    const doc = index.documents.get(body.path);
    if (action === 'book-file') {
      if (body.revision !== index.revision) throw new DirectoryError('扫描结果已更新，请重新扫描后再保存。');
      if (doc) return {base64:doc.bytes.toString('base64')};
      const asset = index.assets.get(body.path);
      if (!asset) throw new DirectoryError('文件不在本次扫描中。');
      try {
        const bytes = readBytes(path.join(index.root, body.path), asset, MAX_IMAGE_BYTES);
        return {base64:bytes.toString('base64')};
      } catch (error) {
        if (error instanceof DirectoryError) throw error;
        throw new DirectoryError('引用图片无法读取，请重新扫描后再保存。');
      }
    }
    if (!doc) throw new DirectoryError('该文件当前不在索引中，请重新扫描。');
    if (body.checksum != null && body.checksum !== doc.checksum) {
      throw new DirectoryError('文件已更新，当前清单中的版本与引用版本不同。');
    }
    return {text:doc.text};
  };
}

function send(res, status, body, type) {
  res.writeHead(status, {'Content-Type':type,'Content-Length':Buffer.byteLength(body),'Cache-Control':'no-store',
    'X-Content-Type-Options':'nosniff','X-Frame-Options':'DENY','Referrer-Policy':'no-referrer'});
  res.end(body);
}

const sendJson = (res, status, value) => send(res, status, JSON.stringify(value), 'application/json; charset=utf-8');

function makeServer(page, service, file) {
  const server = http.createServer({requestTimeout:15000}, async (req, res) => {
    const authority = `${HOST}:${server.address().port}`;
    const header = (name, value) => req.headersDistinct[name]?.length === 1 && req.headersDistinct[name][0] === value;
    if (!header('host', authority)) return sendJson(res, 404, {error:'地址不可用。'});
    if (req.method === 'GET' && req.url === '/') return send(res, 200, page, 'text/html; charset=utf-8');
    const route = /^\/local-directory\/(select|scan|search|preview|book-file|book-save)$/.exec(req.url);
    if (req.method !== 'POST' || !route) return sendJson(res, 404, {error:'地址不可用。'});
    if (!header('origin', `http://${authority}`) || !header('x-fh-local','1') || !header('content-type','application/json')) {
      return sendJson(res, 403, {error:'目录接口仅允许本地助手访问。'});
    }
    const length = Number(req.headers['content-length']);
    const maximum = route[1] === 'book-save' ? MAX_BASE64 + 2 * 1024 * 1024 : 32768;
    if (req.headers['transfer-encoding'] || !Number.isInteger(length) || length < 1 || length > maximum) {
      return sendJson(res, 400, {error:'请求大小无效。'});
    }
    let body;
    try {
      const pieces = [];
      let received = 0;
      for await (const piece of req) {
        received += piece.length;
        if (received > maximum || received > length) throw new Error();
        pieces.push(piece);
      }
      if (received !== length) throw new Error();
      body = JSON.parse(decoder.decode(Buffer.concat(pieces)));
      if (!body || typeof body !== 'object' || Array.isArray(body)) throw new Error();
    } catch {return sendJson(res, 400, {error:'请求格式无效。'});}
    try {
      if (route[1] === 'book-save') {
        const updated = saveCurrentBook(file, body);
        page = updated.page;
        return sendJson(res, 200, updated.result);
      }
      sendJson(res, 200, await service(route[1], body));
    }
    catch (error) {
      if (error instanceof DirectoryError) sendJson(res, 409, {error:error.message});
      else sendJson(res, 500, {error:'本地目录操作未完成，请确认目录可访问后重试。'});
    }
  });
  return server;
}

function openBrowser(url) {
  const system = path.join(process.env.SystemRoot || 'C:\\Windows', 'System32');
  const commands = {win32:[path.join(system, 'rundll32.exe'),'url.dll,FileProtocolHandler',url], darwin:['/usr/bin/open',url]};
  const [command, ...args] = commands[process.platform] || ['xdg-open',url];
  const child = spawn(command, args, {stdio:'ignore', windowsHide:true});
  child.on('error', () => console.error('请在浏览器打开上方本地地址。'));
  child.unref();
}

function main() {
  const {values} = parseArgs({options:{help:{type:'boolean'}, 'no-browser':{type:'boolean'},
    port:{type:'string',default:String(PORT)}, settings:{type:'string',default:SETTINGS}}});
  if (values.help) {
    console.log('用法 node "项目知识手册.html" [--no-browser]');
    return;
  }
  const port = Number(values.port);
  if (!/^\d+$/.test(values.port) || !Number.isInteger(port) || port > 65535) throw new Error('本地端口无效。');
  const file = fs.realpathSync(__filename);
  const server = makeServer(localPage(file), directoryService(path.resolve(values.settings)), file);
  server.on('error', error => {
    console.error(error.code === 'EADDRINUSE' ? `本地端口 ${port} 已占用，请关闭先前的手册服务后重试。` : '本地手册服务启动失败。');
    process.exitCode = 1;
  });
  server.listen(port, HOST, () => {
    const url = `http://${HOST}:${server.address().port}/`;
    console.log(`本地目录问答已启动 ${url}\n请保持此窗口打开。按 Ctrl+C 退出。`);
    if (!values['no-browser']) openBrowser(url);
  });
}

if (require.main === module) {
  try {main();}
  catch (error) {console.error(error.message); process.exitCode = 1;}
}
