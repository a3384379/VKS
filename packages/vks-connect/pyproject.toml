[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vks-connect"
version = "3.1.0rc8"
description = "VKS version-pinned requirements MCP connector"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.30,<2",
]

[project.scripts]
vks-connect = "vks_connect.cli:main"

[project.optional-dependencies]
offline = ["onnxruntime==1.22.1", "tokenizers==0.22.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vks_connect = ["mcp_tools.resolved.json", "sidebar.html", "markdown-vendor.js", "markdown-vendor.css", "markdown-licenses.txt"]
