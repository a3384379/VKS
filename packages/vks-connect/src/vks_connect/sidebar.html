<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VKS 知识工作台</title>
  <!-- markdown-css -->
  <style>
    :root {
      color-scheme: light;
      --ink: #172520;
      --canvas: #fafcfb;
      --surface: #fff;
      --muted: #54635c;
      --line: #d5e0da;
      --accent: #176b57;
      --on-accent: #fff;
      --inset: #f1f6f3;
      --stripe: #fafcfb;
      --code: #963d57;
      --error: #983c36;
      font: 15px/1.6 system-ui, -apple-system, sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #edf4f0;
      --canvas: #17201c;
      --surface: #1e2b25;
      --muted: #adc0b7;
      --line: #40534a;
      --accent: #91e0c2;
      --on-accent: #12251e;
      --inset: #263930;
      --stripe: #22322b;
      --code: #ffb4c7;
      --error: #ffa9a3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    main { width: min(100%, 900px); margin: auto; padding: clamp(16px, 5vw, 48px); }
    header { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 34px); letter-spacing: -.04em; }
    p { margin: .5rem 0; }
    #search, article { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px; }
    #search { margin-top: 20px; }
    label { display: block; font-weight: 650; margin-bottom: 4px; }
    [hidden] { display: none !important; }
    select, input, button { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
    select, input { background: var(--surface); color: var(--ink); min-width: 0; }
    input::placeholder { color: var(--muted); opacity: 1; }
    select { max-width: 100%; }
    .search { display: flex; flex-wrap: wrap; gap: 8px; }
    input { flex: 1 1 12rem; }
    button { border-color: var(--accent); background: var(--accent); color: var(--on-accent); cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    a { color: var(--accent); text-underline-offset: 3px; }
    #scope, #status { color: var(--muted); }
    #scope { margin: 6px 0 14px; }
    #status { min-height: 1.6em; }
    #results { display: grid; gap: 10px; }
    article h2 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
    #offline-search { background: var(--surface); color: var(--accent); }
    #plan-settings { margin-top: .7rem; }
    #plan-settings summary, .references summary { cursor: pointer; }
    #plan-settings .search { align-items: center; }
    #plan-status, article > small { color: var(--muted); }
    .references { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
    .references li { margin: .35rem 0; }
    .rich-markdown .citation { color: var(--accent); padding: 0 .18em; }
    .preview-link, .preview-title {
      border: 0; border-radius: 2px; padding: 0; background: transparent; color: var(--accent);
      text-align: start; text-decoration: underline; text-underline-offset: 3px;
    }
    .preview-title { color: inherit; text-decoration: none; overflow-wrap: anywhere; }
    .preview-title:hover { text-decoration: underline; }
    #chapter-preview {
      width: min(720px, calc(100% - 24px)); max-height: min(680px, 86dvh); padding: 0;
      background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
    }
    #chapter-preview[open] { display: flex; flex-direction: column; }
    #chapter-preview::backdrop { background: #0007; }
    .chapter-header, #chapter-footer { padding: 12px 16px; flex: none; }
    .chapter-header { display: flex; gap: 12px; align-items: start; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .chapter-header button { white-space: nowrap; }
    #chapter-title { margin: 0; font-size: 19px; overflow-wrap: anywhere; }
    #chapter-document { color: var(--muted); overflow-wrap: anywhere; }
    #chapter-body { min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 12px 16px; overflow-wrap: anywhere; }
    #chapter-body:focus-visible { outline-offset: -3px; }
    #chapter-body > .rich-markdown > :first-child { margin-top: 0; }
    #chapter-footer { border-top: 1px solid var(--line); }
    article .rich-markdown, #navigation { margin: .75rem 0; }
    article .rich-markdown > :first-child { margin-top: 0; }
    /* Apply the host palette to the shared Markdown reader and its overlays. */
    .rich-markdown, .rich-markdown strong, .rich-markdown b, .rich-markdown pre code { color: var(--ink); }
    .rich-markdown a { color: var(--accent); }
    .rich-markdown pre, .rich-markdown :not(pre) > code, .rich-markdown blockquote, .rich-markdown th,
    .rich-markdown .md-diagram-head { background: var(--inset); }
    .rich-markdown :not(pre) > code { color: var(--code); }
    .rich-markdown .math-error { color: var(--error); }
    .rich-markdown tr:nth-child(even) td { background: var(--stripe); }
    .rich-markdown h2, .rich-markdown pre, .rich-markdown :not(pre) > code, .rich-markdown .md-table-scroll,
    .rich-markdown th, .rich-markdown td, .rich-markdown details, .rich-markdown .footnotes,
    .rich-markdown .md-diagram, .rich-markdown .md-diagram details, .rich-markdown .md-image-note,
    .md-image-dialog, .md-image-toolbar, .md-image-toolbar button, .md-selection-menu { border-color: var(--line); }
    .rich-markdown blockquote { color: var(--ink); border-color: var(--accent); }
    .rich-markdown .task-list-item input { accent-color: var(--accent); }
    .rich-markdown .md-code-language, .rich-markdown .hljs-comment, .rich-markdown .hljs-quote,
    .rich-markdown .md-image-note, .rich-markdown .md-image-caption, .rich-markdown .md-diagram-head,
    .rich-markdown .md-diagram-status, .rich-markdown .md-diagram summary, .md-media-hint,
    .md-image-help { color: var(--muted); }
    .rich-markdown .md-diagram, .md-image-dialog, .md-image-toolbar button,
    .md-selection-menu, .md-selection-menu button { background: var(--surface); color: var(--ink); }
    .md-image-toolbar button[aria-pressed="true"], .md-selection-menu button:hover,
    .md-selection-menu button:focus-visible { background: var(--inset); color: var(--accent); }
    /* Rendered diagrams contain their own light-theme ink. Keep that canvas light. */
    .rich-markdown .md-diagram-image, .md-image-canvas { background: #f8faf9; }
    .rich-markdown :is(.hljs-number, .hljs-literal, .hljs-symbol) { color: #a74c2b; }
    [data-theme="dark"] .rich-markdown :is(.hljs-keyword, .hljs-selector-tag, .hljs-type) { color: #dfb6f2; }
    [data-theme="dark"] .rich-markdown :is(.hljs-string, .hljs-attr, .hljs-template-tag) { color: #a8dfab; }
    [data-theme="dark"] .rich-markdown :is(.hljs-number, .hljs-literal, .hljs-symbol) { color: #ffc29c; }
    [data-theme="dark"] .rich-markdown :is(.hljs-title, .hljs-function) { color: #aad7ff; }
    #navigation input { width: 100%; }
    #navigation button { margin-top: .35rem; }
    #embedding-settings { margin-top: .7rem; }
    #embedding-settings summary { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>VKS 知识工作台</h1>
    <a id="studio" hidden target="_blank" rel="noopener noreferrer">打开 Studio</a>
  </header>
  <section id="navigation" hidden aria-label="Studio 链接">
    <p id="navigation-status" role="status"></p>
    <label for="studio-address">Studio 地址</label>
    <input id="studio-address" readonly>
    <button id="copy-address" type="button">复制链接</button>
  </section>
  <section id="search" role="search">
    <button id="pick-library" type="button" hidden>选择成品库</button>
    <label id="project-label" for="project">项目</label>
    <select id="project" disabled></select>
    <p id="scope">正在读取可访问项目…</p>
    <label for="query">搜索保存版本</label>
    <div class="search">
      <input id="query" maxlength="1000" placeholder="输入关键词或完整问题" disabled>
      <button id="submit" type="button" disabled>搜索</button>
      <button id="offline-search" type="button" hidden disabled>本地检索</button>
    </div>
    <details id="plan-settings" hidden>
      <summary>ChatGPT 订阅设置</summary>
      <p id="plan-status" role="status"></p>
      <div class="search">
        <button id="plan-connect" type="button" hidden>使用 ChatGPT 登录</button>
        <button id="plan-disconnect" type="button" hidden>退出 ChatGPT 连接</button>
        <a href="https://chatgpt.com/#settings/usage" target="_blank" rel="noopener noreferrer">管理用量</a>
      </div>
      <label id="plan-model-label" hidden>订阅模型 <select id="plan-model"></select></label>
      <label id="plan-consent-label" hidden><input type="checkbox" id="plan-consent"> 允许发送问题和必要的原文章节片段给 OpenAI</label>
    </details>
    <details id="embedding-settings" hidden>
      <summary>云端向量检索（可选）</summary>
      <p id="embedding-index"></p>
      <label><input type="checkbox" id="cloud-search"> 使用已配置的云端嵌入服务</label>
      <label for="embedding-url">嵌入服务地址</label>
      <div class="search">
        <input id="embedding-url" type="url" value="https://api.openai.com/v1" maxlength="2048">
        <button id="embedding-save" type="button">在系统窗口输入 API Key</button>
      </div>
      <p id="embedding-status" role="status"></p>
    </details>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="results" aria-label="检索结果"></div>
</main>
<dialog id="chapter-preview" aria-labelledby="chapter-title">
  <div class="chapter-header">
    <div>
      <h2 id="chapter-title"></h2>
      <small id="chapter-document" hidden></small>
    </div>
    <button id="chapter-close" type="button" autofocus>关闭</button>
  </div>
  <div id="chapter-body" role="region" aria-label="章节正文" tabindex="0"></div>
  <div id="chapter-footer" hidden><a id="chapter-source" target="_blank" rel="noopener noreferrer"></a></div>
</dialog>
<!-- markdown-js -->
<script>
  "use strict";
  const byId = (id) => document.getElementById(id);
  const project = byId("project");
  const query = byId("query");
  const submit = byId("submit");
  const scopeLabel = byId("scope");
  const status = byId("status");
  const results = byId("results");
  const studio = byId("studio");
  const pickLibrary = byId("pick-library");
  const navigation = byId("navigation");
  const navigationStatus = byId("navigation-status");
  const address = byId("studio-address");
  const chapterPreview = byId("chapter-preview");
  const chapterBody = byId("chapter-body");
  const offlineSearch = byId("offline-search");
  const planSettings = byId("plan-settings");
  const planModel = byId("plan-model");
  const planConsent = byId("plan-consent");
  const rasterTypes = new Set(["image/png", "image/jpeg", "image/gif", "image/webp"]);
  const pending = new Map();
  let sequence = 0;
  let request = 0;
  let scope;
  let studioBase;
  let libraryMode = false;
  let navigationRequest = 0;
  let planState;
  let planRevision = 0;

  function post(message) {
    window.parent.postMessage({jsonrpc: "2.0", ...message}, "*");
  }

  function rpc(method, params, timeoutMs = 15000) {
    const id = ++sequence;
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        pending.delete(id);
        reject(new Error("连接超时，请重试。"));
      }, timeoutMs);
      pending.set(id, {resolve, reject, timeout});
      post({id, method, params});
    });
  }

  async function callToolResult(name, args, timeoutMs = 35000) {
    const reply = await rpc("tools/call", {name, arguments: args}, timeoutMs);
    if (reply.isError || !reply.structuredContent) {
      throw new Error(reply.structuredContent?.error?.message || "VKS 未返回可用数据。");
    }
    return reply.structuredContent;
  }

  async function callTool(name, args, timeoutMs) {
    return (await callToolResult(name, args, timeoutMs)).data;
  }

  byId("copy-address").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(address.value);
      navigationStatus.textContent = libraryMode ? "已复制成品库链接。" : "已复制 Studio 链接。";
    } catch {
      address.focus();
      address.select();
      navigationStatus.textContent = "已选中地址，请按 ⌘C 或 Ctrl+C 复制。";
    }
  });

  function navigationLink(link, value, locator, beforeOpen) {
    try {
      const url = new URL(value);
      if (url.username || url.password || url.search) return false;
      if (libraryMode) {
        const base = new URL(scope.file_url);
        if (url.protocol !== "file:" || url.host !== base.host || url.pathname !== base.pathname) return false;
      } else if (!studioBase || url.origin !== studioBase.origin || url.pathname !== "/") return false;
      link.href = url.href;
      link.onclick = async (event) => {
        if (!event.isTrusted || event.defaultPrevented) return;
        event.preventDefault();
        beforeOpen?.();
        const ticket = ++navigationRequest;
        const destination = libraryMode ? "成品库" : "Studio";
        address.value = url.href;
        navigation.hidden = false;
        navigationStatus.textContent = `正在打开${destination}…`;
        try {
          const result = libraryMode
            ? await callTool("open_vks_library", locator)
            : await callTool("open_vks_studio", {fragment: url.hash.slice(1)});
          if (!result?.requested) throw new Error();
          if (ticket === navigationRequest) navigationStatus.textContent = `已请求系统浏览器打开 ${destination}。`;
        } catch {
          if (ticket === navigationRequest) navigationStatus.textContent = `系统未能打开 ${destination}，可以复制地址。`;
        }
      };
      return true;
    } catch {
      return false;
    }
  }

  async function selectProject() {
    const ticket = ++request;
    chapterPreview.close();
    scope = undefined;
    query.disabled = submit.disabled = true;
    status.textContent = "";
    results.replaceChildren();
    if (!project.value) {
      scopeLabel.textContent = "当前凭据没有可访问的项目。";
      return;
    }
    scopeLabel.textContent = "正在读取最新保存版本…";
    const projectId = project.value;
    try {
      const context = await callTool("get_project_context", {
        project_id: projectId, release_selector: "latest_saved",
      });
      if (ticket !== request) return;
      if (!context.scope?.release_id || context.scope.project_id !== projectId) throw new Error("缺少准确的保存版本。");
      scope = {project_id: projectId, release_id: context.scope.release_id};
      scopeLabel.textContent = "保存版本 " + (context.scope.release_label || context.scope.release_id);
      query.disabled = submit.disabled = false;
    } catch (error) {
      if (ticket === request) scopeLabel.textContent = error.message;
    }
  }

  function useLibrary(data) {
    libraryMode = true;
    ++request;
    chapterPreview.close();
    results.replaceChildren();
    status.textContent = "";
    navigation.hidden = true;
    scope = data.library;
    const index = scope?.vector_index;
    const localIndex = scope?.local_vector_index;
    byId("embedding-settings").hidden = !index;
    byId("cloud-search").checked = false;
    byId("embedding-index").textContent = index ? `${index.model} · ${index.dimensions} 维` : "";
    byId("embedding-status").textContent = "";
    byId("project-label").hidden = project.hidden = true;
    document.querySelector('label[for="query"]').textContent = "向成品库提问";
    query.placeholder = "输入要分析的问题";
    byId("navigation").setAttribute("aria-label", "成品库链接");
    document.querySelector('label[for="studio-address"]').textContent = "成品库地址";
    pickLibrary.textContent = scope ? "更换成品库" : "选择成品库";
    pickLibrary.hidden = false;
    scopeLabel.textContent = scope
      ? `${scope.project_name} · ${scope.version} · ${scope.file_name}${localIndex ? " · 本地向量" : ""}`
      : data.message || "请选择本机 VKS 只读成品库 HTML。";
    query.disabled = submit.disabled = !scope;
    submit.textContent = "AI 分析";
    offlineSearch.hidden = false;
    offlineSearch.disabled = !scope;
    offlineSearch.textContent = "本地检索";
    resetPlan();
    if (scope) void updatePlan();
    studio.textContent = "打开成品库";
    studio.hidden = !scope || !navigationLink(studio, scope.file_url, {library_ref: scope.library_ref});
  }

  function resetPlan() {
    ++planRevision;
    planState = undefined;
    planSettings.hidden = !scope;
    planSettings.open = false;
    byId("plan-status").textContent = "正在检查 ChatGPT 连接…";
    for (const id of ["plan-connect", "plan-disconnect", "plan-model-label", "plan-consent-label"]) {
      byId(id).hidden = true;
    }
    planModel.replaceChildren();
    planConsent.checked = false;
  }

  async function updatePlan(action = "status") {
    if (!libraryMode || !scope) return;
    const ticket = ++planRevision;
    const library_ref = scope.library_ref;
    const connect = byId("plan-connect");
    const disconnect = byId("plan-disconnect");
    connect.disabled = disconnect.disabled = true;
    try {
      const value = await callTool("vks_library_chatgpt_plan", {library_ref, action});
      if (ticket !== planRevision) return;
      planState = value;
      connect.hidden = !value.can_ask || value.connected || value.pending;
      disconnect.hidden = !value.connected;
      byId("plan-status").textContent = !value.can_ask
        ? "请更换支持 AI 问答的成品库。当前可继续本地检索。"
        : value.pending ? "请在系统浏览器完成授权。"
        : value.connected ? `当前账号 ${value.account}` : value.message || "登录后可使用自己的 ChatGPT 额度分析。";
      if (!value.connected || action === "disconnect") {
        planModel.replaceChildren();
        planConsent.checked = false;
      }
      if (action === "models") {
        const selected = planModel.value;
        planModel.replaceChildren(...value.models.map((item) => new Option(item.name, item.id)));
        if (value.models.some((item) => item.id === selected)) planModel.value = selected;
        if (!value.models.length) byId("plan-status").textContent = "当前账号没有可用的订阅模型。";
      }
      byId("plan-model-label").hidden = !planModel.options.length;
      byId("plan-consent-label").hidden = !planModel.options.length;
      if (value.pending) {
        setTimeout(() => { if (ticket === planRevision) void updatePlan(); }, 1500);
      } else if (action !== "models" && value.can_ask && value.connected && planSettings.open && !planModel.options.length) {
        void updatePlan("models");
      }
    } catch (error) {
      if (ticket === planRevision) byId("plan-status").textContent = error.message;
    } finally {
      if (ticket === planRevision) connect.disabled = disconnect.disabled = false;
    }
  }

  planSettings.addEventListener("toggle", () => {
    if (planSettings.open && planState?.connected && planState.can_ask && !planModel.options.length) void updatePlan("models");
  });
  byId("plan-connect").addEventListener("click", (event) => {
    if (event.isTrusted) void updatePlan("connect");
  });
  byId("plan-disconnect").addEventListener("click", (event) => {
    if (event.isTrusted) void updatePlan("disconnect");
  });
  byId("cloud-search").addEventListener("change", (event) => {
    offlineSearch.textContent = event.target.checked ? "云端检索" : "本地检索";
  });

  byId("embedding-save").addEventListener("click", async (event) => {
    if (!event.isTrusted || !scope?.vector_index) return;
    const libraryRef = scope.library_ref;
    const display = byId("embedding-status");
    const control = event.currentTarget;
    control.disabled = true;
    display.textContent = "请在系统窗口输入 Key。";
    try {
      const configured = await callTool("configure_vks_library_embedding", {
        library_ref: libraryRef, endpoint: byId("embedding-url").value.trim(),
      }, 110000);
      if (scope?.library_ref === libraryRef) display.textContent = configured.cancelled ? "已取消。" : "已保存。勾选云端检索后生效。";
    } catch (error) {
      if (scope?.library_ref === libraryRef) display.textContent = error.message;
    } finally {
      control.disabled = false;
    }
  });

  pickLibrary.addEventListener("click", async (event) => {
    if (!event.isTrusted) return;
    pickLibrary.disabled = true;
    status.textContent = "请选择 VKS 只读成品库 HTML…";
    try {
      const library = await callTool("choose_vks_library", {}, 120000);
      if (library.cancelled) status.textContent = "已取消选择。";
      else useLibrary({library});
    } catch (error) {
      status.textContent = error.message;
    } finally {
      pickLibrary.disabled = false;
    }
  });

  function begin(result) {
    if (result._meta?.["vks/library"]) {
      useLibrary(result._meta["vks/library"]);
      return;
    }
    const data = result._meta?.["vks/workspace"];
    if (!data) {
      scopeLabel.textContent = result.structuredContent?.error?.message || "无法读取工作台，请重新打开。";
      return;
    }
    libraryMode = false;
    ++planRevision;
    planSettings.hidden = offlineSearch.hidden = true;
    byId("embedding-settings").hidden = true;
    byId("project-label").hidden = project.hidden = false;
    submit.textContent = "搜索";
    document.querySelector('label[for="query"]').textContent = "搜索保存版本";
    query.placeholder = "输入关键词或完整问题";
    try {
      const url = new URL(data.studioBaseUrl);
      const loopback = ["localhost", "[::1]"].includes(url.hostname) || /^127(?:\.\d{1,3}){3}$/.test(url.hostname);
      if ((url.protocol === "https:" || url.protocol === "http:" && loopback) && !url.username && !url.password) {
        studioBase = url;
        studio.hidden = !navigationLink(studio, url.href);
      }
    } catch {}
    project.replaceChildren(...data.projects.map((item) => new Option(item.name, item.id)));
    if (data.projects.some((item) => item.id === data.defaultProjectId)) project.value = data.defaultProjectId;
    project.disabled = !project.options.length;
    selectProject();
  }

  window.addEventListener("message", ({source, data}) => {
    if (source !== window.parent || data?.jsonrpc !== "2.0") return;
    const call = pending.get(data.id);
    if (call && !data.method) {
      pending.delete(data.id);
      clearTimeout(call.timeout);
      if (data.error) call.reject(new Error("宿主无法完成请求。"));
      else call.resolve(data.result);
    } else if (data.method === "ui/notifications/tool-result") {
      begin(data.params);
    } else if (data.method === "ui/notifications/host-context-changed" && data.params?.theme) {
      document.documentElement.dataset.theme = data.params.theme;
    } else if (data.method === "ui/resource-teardown" && data.id !== undefined) {
      post({id: data.id, result: {}});
    }
  });

  function displayMarkdown(source) {
    // Historical documents may set Mermaid display options. Keep the graph and
    // use the local renderer's strict configuration. Studio retains the source.
    let fence;
    return source.split(/(?<=\n)/).map((line) => {
      const marker = /^ {0,3}(`{3,}|~{3,})(.*)/.exec(line);
      if (fence) {
        if (marker && marker[1][0] === fence[0][0] && marker[1].length >= fence[0].length &&
            !marker[2].trim()) fence = undefined;
        else if (fence[1] === "mermaid" && /^\s*%%\{\s*init(?:ialize)?\s*:.*\}%%\s*$/i.test(line)) return "";
      } else if (marker) {
        fence = [marker[1], marker[2].trim().split(/\s/)[0].toLowerCase()];
      }
      return line;
    }).join("");
  }

  async function readChapter(locator, ticket) {
    if (libraryMode) {
      const chunks = [];
      let offset = 0;
      for (let index = 0; index < 8 && ticket === request; index++) {
        const page = await callTool("read_vks_library_section", {...locator, offset, max_chars: 8000});
        if (page.section_id !== locator.section_id || page.offset !== offset || typeof page.content !== "string") throw new Error();
        chunks.push(page.content);
        if (page.next_offset === null) return chunks.join("");
        if (!Number.isInteger(page.next_offset) || page.next_offset <= offset) throw new Error();
        offset = page.next_offset;
      }
      throw new Error();
    }
    const {project_id, release_id, document_id, document_revision_id, section_revision_id, content_sha256} = locator;
    if (project_id !== scope.project_id || release_id !== scope.release_id) throw new Error();
    const chunks = [];
    let offset = 0;
    for (let index = 0; index < 8 && ticket === request; index++) {
      const page = await callTool("get_workspace_document", {
        project_id, release_id, document_id, revision_id: document_revision_id,
        section_revision_ids: [section_revision_id], max_chars: 8000, offset,
      });
      const section = page.sections?.[0];
      if (page.document_id !== document_id || page.entity_revision_id !== document_revision_id ||
          page.offset !== offset || page.sections.length !== 1 || section.section_revision_id !== section_revision_id ||
          section.locator?.content_sha256 !== content_sha256 || typeof section.content !== "string") throw new Error();
      chunks.push(section.content);
      if (page.next_offset === null) return chunks.join("");
      if (!Number.isInteger(page.next_offset) || page.next_offset <= offset) throw new Error();
      offset = page.next_offset;
    }
    throw new Error();
  }

  async function chapterImages(markdown, locator, ticket) {
    const available = new Map();
    const paths = [...window.VksReaderMarkdown.imageReferences(markdown)].filter((target) => {
      try {
        const path = decodeURIComponent(target);
        return path.trim() && path.length <= 2048 &&
          !/^(?:[a-z][a-z\d+.-]*:|\/)|[\\?#\x00-\x1f\x7f]/i.test(path);
      } catch { return false; }
    });
    for (const path of paths.slice(0, 12)) {
      if (ticket !== request) break;
      try {
        const {release_id, document_id, document_revision_id} = locator;
        const reply = await rpc("tools/call", libraryMode
          ? {name: "read_vks_library_image", arguments: {...locator, path}}
          : {name: "read_vks_document_image", arguments: {release_id, document_id, document_revision_id, path}}, 35000);
        const image = reply.content?.find((part) => part.type === "image");
        if (!reply.isError && rasterTypes.has(image?.mimeType) && typeof image.data === "string" &&
            image.data.length <= 2796204 && /^[A-Za-z0-9+/]+={0,2}$/.test(image.data)) {
          available.set(path, `data:${image.mimeType};base64,${image.data}`);
        }
      } catch {}
    }
    return available;
  }

  async function loadChapter(row, ticket) {
    if (ticket !== request) throw new Error();
    const markdown = displayMarkdown(await readChapter(row.locator, ticket));
    if (ticket !== request) throw new Error();
    return {markdown, images: await chapterImages(markdown, row.locator, ticket)};
  }

  function chapterMarkup({markdown, images}, title) {
    const chapter = window.VksReaderMarkdown.render(markdown, {resolveImage: (path) => images.get(path)});
    const heading = chapter.firstElementChild;
    if (heading?.matches("h1,h2,h3,h4,h5,h6") && heading.textContent.trim() === title) heading.remove();
    return chapter;
  }

  byId("chapter-close").addEventListener("click", () => chapterPreview.close());
  chapterPreview.addEventListener("close", () => {
    if (!chapterPreview.open) chapterBody.replaceChildren();
  });

  async function showChapterPreview(row, ticket, load) {
    byId("chapter-title").textContent = row.entity.name;
    const documentTitle = byId("chapter-document");
    documentTitle.textContent = row.documentTitle || "";
    documentTitle.hidden = !row.documentTitle || row.documentTitle === row.entity.name;
    const source = byId("chapter-source");
    source.textContent = libraryMode ? "在成品库打开原文章节" : "在 Studio 打开原文章节";
    byId("chapter-footer").hidden = !navigationLink(source, libraryMode ? row.url : row.studio_url, row.locator,
      () => chapterPreview.close());
    const loading = document.createElement("p");
    loading.setAttribute("role", "status");
    loading.textContent = "正在读取原文章节…";
    chapterBody.replaceChildren(loading);
    chapterBody.scrollTop = 0;
    chapterPreview.showModal();
    try {
      const chapter = await load();
      if (loading.isConnected && chapterPreview.open && ticket === request) {
        loading.replaceWith(chapterMarkup(chapter, row.entity.name));
      }
    } catch {
      if (loading.isConnected && chapterPreview.open && ticket === request) {
        loading.textContent = "暂时无法读取完整章节。";
      }
    }
  }

  function previewAction(row, ticket) {
    let chapter;
    const load = () => chapter ??= loadChapter(row, ticket).catch((error) => {
      chapter = undefined;
      throw error;
    });
    return () => {
      if (ticket === request && !chapterPreview.open) void showChapterPreview(row, ticket, load);
    };
  }

  function previewButton(label, css, open) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = css;
    button.textContent = label;
    button.setAttribute("aria-haspopup", "dialog");
    button.addEventListener("click", open);
    return button;
  }

  function libraryRow(row, libraryRef) {
    return {
      entity: {name: row.title}, documentTitle: row.document_title, url: row.file_url,
      locator: {library_ref: libraryRef, section_id: row.section_id},
    };
  }

  function renderAnalysis(data, ticket, libraryRef) {
    const article = document.createElement("article");
    const heading = document.createElement("h2");
    heading.textContent = "AI 分析";
    const answer = window.VksReaderMarkdown.render(data.answer);
    const references = new Map(data.sources.map((source) => [source.number, {
      source, open: previewAction(libraryRow(source, libraryRef), ticket),
    }]));
    // The model does not choose link destinations. Only cited, validated VKS sections have actions.
    for (const link of answer.querySelectorAll("a")) link.replaceWith(...link.childNodes);
    const walker = document.createTreeWalker(answer, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) {
      if (!walker.currentNode.parentElement.closest("pre, code, .katex")) nodes.push(walker.currentNode);
    }
    for (const node of nodes) {
      const parts = node.textContent.split(/(\[\d{1,3}\])/g);
      if (parts.length === 1) continue;
      node.replaceWith(...parts.map((part, i) => {
        const item = i % 2 ? references.get(Number(part.slice(1, -1))) : null;
        if (!item) return document.createTextNode(part);
        const button = previewButton(part, "preview-link citation", item.open);
        button.setAttribute("aria-label", `预览引用 ${part} ${item.source.title}`);
        return button;
      }));
    }
    article.append(heading, answer);
    if (references.size) {
      const details = document.createElement("details");
      details.className = "references";
      const summary = document.createElement("summary");
      summary.textContent = `原文引用（${references.size}）`;
      const list = document.createElement("ul");
      for (const [number, {source, open}] of references) {
        const item = document.createElement("li");
        item.append(previewButton(`[${number}] ${source.title}`, "preview-link", open));
        list.append(item);
      }
      details.append(summary, list);
      article.append(details);
    }
    results.append(article);
  }

  function setBusy(busy) {
    submit.disabled = offlineSearch.disabled = busy || !scope;
  }

  async function analyze() {
    const question = query.value.trim();
    if (!scope || !question || submit.disabled) return;
    if (!planState?.can_ask || !planState.connected || !planModel.value || !planConsent.checked) {
      planSettings.open = true;
      status.textContent = planState?.can_ask === false ? "当前成品库可使用本地检索。"
        : "请先确认 ChatGPT 连接、模型和资料发送许可。";
      return;
    }
    const ticket = ++request;
    const library_ref = scope.library_ref;
    setBusy(true);
    status.textContent = "正在分析…";
    results.replaceChildren();
    try {
      const data = await callTool("analyze_vks_library", {
        library_ref, question, model: planModel.value, allow_external: true,
      }, 155000);
      if (ticket !== request) return;
      renderAnalysis(data, ticket, library_ref);
      status.textContent = data.used_model === false ? "没有找到可用于分析的章节" : "分析完成 · 使用 ChatGPT 额度";
    } catch (error) {
      if (ticket === request) status.textContent = error.message;
    } finally {
      if (ticket === request) setBusy(false);
    }
  }

  project.addEventListener("change", selectProject);
  async function search() {
    const term = query.value.trim();
    if (!scope || !term || submit.disabled) return;
    const ticket = ++request;
    setBusy(true);
    status.textContent = "正在检索…";
    results.replaceChildren();
    try {
      const libraryRef = scope.library_ref;
      const libraryResult = libraryMode ? await callToolResult("search_vks_library", {
        library_ref: libraryRef, query: term, limit: 8,
        retrieval_mode: byId("cloud-search").checked ? "hybrid" : "auto",
      }) : null;
      const rows = libraryResult ? libraryResult.data.map((row) => libraryRow(row, libraryRef)) : await callTool("search_knowledge", {
        ...scope, query: term, retrieval_mode: "keyword", kinds: ["section"], limit: 8,
      });
      if (ticket !== request) return;
      for (const row of rows) {
        const article = document.createElement("article");
        const title = document.createElement("h2");
        article.append(title);
        if (row.documentTitle && row.documentTitle !== row.entity.name) {
          const documentTitle = document.createElement("small");
          documentTitle.textContent = row.documentTitle;
          article.append(documentTitle);
        }
        if (row.locator) {
          const open = previewAction(row, ticket);
          title.append(previewButton(row.entity.name, "preview-title", open));
        } else {
          title.textContent = row.entity.name;
          const link = document.createElement("a");
          link.textContent = "在 Studio 打开版本目录";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          if (navigationLink(link, row.studio_url)) article.append(link);
        }
        results.append(article);
      }
      const count = rows.length ? `找到 ${rows.length} 个章节` : "没有找到匹配章节。";
      const used = libraryResult?.retrieval?.used;
      const notes = {
        embedding_not_configured: "尚未配置向量检索",
        embedding_key_missing: "未找到嵌入服务 Key",
        embedding_model_mismatch: "嵌入配置与成品库模型不匹配",
        embedding_unavailable: "嵌入服务暂不可用",
        embedding_response_invalid: "嵌入服务返回的向量无效",
        no_vector_index: "此成品库没有可用向量",
        no_local_index: "此成品库没有本地向量索引",
        local_model_unavailable: "本地向量模型不可用",
      };
      const note = notes[libraryResult?.retrieval?.fallback];
      const vectorLabels = {local: "本地向量 + 关键词", cloud: "云端向量 + 关键词"};
      const modeLabel = vectorLabels[libraryResult?.retrieval?.vector_source] || "关键词检索";
      status.textContent = used ? `${modeLabel} · ${count}${note ? `（${note}）` : ""}` : count;
    } catch (error) {
      if (ticket === request) status.textContent = error.message;
    } finally {
      if (ticket === request) setBusy(false);
    }
  }
  function submitQuery(event) {
    if (event.isTrusted) void (libraryMode ? analyze() : search());
  }
  submit.addEventListener("click", submitQuery);
  offlineSearch.addEventListener("click", (event) => { if (event.isTrusted) void search(); });
  query.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.isComposing) submitQuery(event);
  });

  rpc("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: {name: "VKS", version: "3.1"},
    appCapabilities: {},
  }).then((response) => {
    if (response.hostContext?.theme) document.documentElement.dataset.theme = response.hostContext.theme;
    post({method: "ui/notifications/initialized", params: {}});
  }).catch((error) => {
    scopeLabel.textContent = error.message;
  });
</script>
</body>
</html>
