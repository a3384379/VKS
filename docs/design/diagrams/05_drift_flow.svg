<text x="650" y="1218.4" font-size="24" font-weight="400" fill="#19304F" text-anchor="middle"><tspan x="650" dy="0">保留旧版本与完整审计链</tspan></text>
<path d="M48,1295 L1252,1295" fill="none" stroke="#C7D8EF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"  />
<text x="48" y="1330" font-size="18" font-weight="400" fill="#627895" text-anchor="start"><tspan x="48" dy="0">新版本仍可显示未解决项，但必须可见标注；不得冒充已确认的当前事实。</tspan></text>
</g></svg>