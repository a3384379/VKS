<text x="1080" y="693.2" font-size="22" font-weight="400" fill="#B87512" text-anchor="middle"><tspan x="1080" dy="0">迁移无法唯一确定</tspan><tspan x="1080" dy="34">保留候选，不自动确认</tspan></text>
