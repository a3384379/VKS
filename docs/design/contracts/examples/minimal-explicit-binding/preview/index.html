<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>VKS 显式绑定：合成开票规则</title>
  <style>
    body { margin: 0; padding: 48px 24px; background: #edf5ff; color: #19324b; font: 16px/1.7 system-ui, sans-serif; }
    main { max-width: 700px; margin: auto; padding: 32px; border: 1px solid #d7e7fa; border-radius: 20px; background: white; }
    h1 { font-size: 26px; line-height: 1.3; }
    .note { color: #5a6e85; }
    details { margin-top: 24px; padding: 18px; background: #f5f9ff; border-radius: 12px; }
    summary { cursor: pointer; color: #1461cc; font-weight: 600; }
  </style>
</head>
<body>
  <main data-vks-page="ui.page.invoice">
    <p class="note">VKS · 本地合成原型</p>
    <h1>开票规则说明</h1>
    <p>本页只演示一个界面操作如何与 Markdown 章节显式关联。</p>
    <details>
      <summary data-vks-action="ui.action.invoice.rules">查看开票规则</summary>
      <p>展开动作仅显示本地说明；不提交开票、不访问业务接口、不修改业务数据。</p>
      <p class="note">该操作在 sidecar 中绑定到 doc.section.invoice.rules。</p>
    </details>
    <p class="note">无 JavaScript、无网络资源、无真实账号或公司数据。</p>
  </main>
</body>
</html>
