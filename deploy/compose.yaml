name: vks
x-runtime: &runtime
  VKS_DB_HOST: database
  VKS_DB_USER: vks
  VKS_DB_NAME: vks
  VKS_DB_PASSWORD: ${POSTGRES_PASSWORD:?请配置数据库密码}
  VKS_DATA_DIR: /data/vks
  VKS_RUNNER_ENABLED: ${VKS_RUNNER_ENABLED:-0}
  VKS_RUNNER_ALLOW_LOOPBACK: ${VKS_RUNNER_ALLOW_LOOPBACK:-0}
  VKS_RUNNER_SECRET_REGISTRY: ${VKS_RUNNER_SECRET_REGISTRY:-}
  VKS_BROKER_HOST: broker
  VKS_BROKER_USER: vks
  VKS_BROKER_VHOST: vks
  VKS_BROKER_PASSWORD: ${RABBITMQ_PASSWORD:?请配置队列密码}
  VKS_ALLOWED_HOSTS: 127.0.0.1,localhost,api
  VKS_MCP_RESOURCE: ${VKS_MCP_RESOURCE:-http://127.0.0.1:8788/mcp}
  VKS_MODEL_ALLOWED_ORIGINS: ${VKS_MODEL_ALLOWED_ORIGINS:-}
  VKS_MODEL_ALLOWED_CIDRS: ${VKS_MODEL_ALLOWED_CIDRS:-0.0.0.0/0,::/0}
  VKS_MODEL_API_KEY: ${VKS_MODEL_API_KEY:-}
services:
  database:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_USER: vks
      POSTGRES_DB: vks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vks -d vks"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  broker:
    image: rabbitmq:4.1-alpine@sha256:3dd4ce7606f9fbf2e2dbca90a02f29c19c5cdf66bf15cdf5237430e3614128ca
    environment:
      RABBITMQ_DEFAULT_USER: vks
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: vks
    volumes: ["broker:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    image: vks-api:local
    build: {context: .., dockerfile: deploy/Dockerfile.api}
    environment:
      <<: *runtime
      VKS_TASK_MODE: celery
    volumes: ["objects:/data/vks"]
    depends_on:
      database: {condition: service_healthy}
      broker: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker-index:
    image: vks-api:local
    command: ["celery", "-A", "services.worker.celery_app:celery", "worker", "-Q", "vks-index", "--concurrency", "2", "--loglevel", "WARNING"]
    environment:
      <<: *runtime
      VKS_TASK_MODE: external
    volumes: ["objects:/data/vks"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  worker-model:
    image: vks-api:local
    command: ["celery", "-A", "services.worker.celery_app:celery", "worker", "-Q", "vks-model", "--concurrency", "1", "--loglevel", "WARNING"]
    environment:
      <<: *runtime
      VKS_TASK_MODE: external
    volumes: ["objects:/data/vks"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  runner:
    profiles: [runner]
    image: vks-runner:local
    build: {context: .., dockerfile: deploy/Dockerfile.runner, additional_contexts: {vks_api_image: "service:api"}}
    command: ["celery", "-A", "services.worker.celery_app:celery", "worker", "-P", "solo", "-Q", "vks-browser", "--concurrency", "1", "--loglevel", "WARNING"]
    environment:
      <<: *runtime
      VKS_TASK_MODE: external
      PLAYWRIGHT_BROWSERS_PATH: /opt/chromium
    volumes: ["objects:/data/vks"]
    shm_size: 1gb
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  mcp:
    profiles: [mcp]
    image: vks-api:local
    command: ["python", "-m", "vks_api.mcp_gateway", "--http", "--host", "0.0.0.0", "--port", "8788"]
    environment:
      VKS_API_URL: http://api:8000
      VKS_MCP_RESOURCE: ${VKS_MCP_RESOURCE:-http://127.0.0.1:8788/mcp}
    ports: ["127.0.0.1:8788:8788"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  web:
    image: vks-web:local
    build: {context: .., dockerfile: deploy/Dockerfile.web}
    ports: ["127.0.0.1:${VKS_PORT:-8765}:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  database: {}
  objects: {}
  broker: {}
